{% extends 'global/base.html' %}

{% block content %}
<div class="container mt-5">
  <h2>Confirmar Exclusão</h2>
  <p>Tem certeza que deseja deletar o membro da equipe <strong>"{{ object }}"</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <a href="{% url 'posvendasapp:tabela_equipe' %}" class="btn btn-secondary">Cancelar</a>
    <button type="submit" class="btn btn-danger">Deletar</button>
  </form>
</div>
{% endblock %}
