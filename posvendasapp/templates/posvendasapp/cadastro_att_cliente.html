{% extends "global/base.html" %}
{% load crispy_forms_tags %}


{%block content %}


    <form method="post" enctype="multipart/form-data" class="form-container formulario-simples">
    <h2>
    {% if modo == 'edição' %}
        Edição de  Cliente
    {% elif modo == 'criação'  %}
        Cadastro de  Cliente
    {% endif %}
    </h2>
    {% csrf_token %}
    {{ cliente_form.as_p }}


    <button type="submit">
    {% if modo == 'edição' %}
        Edição de  Cliente
    {% elif modo == 'criação' %}
        Cadastro de  Cliente
    {% endif %}
    </button>
</form>

{% endblock %}
