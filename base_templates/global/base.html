{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    {% include "global/partials/_head.html" %}
</head>

<body>
{% include "global/partials/_header.html" %}

<main>
    {%block content %}{% endblock %}
    {% include 'global/partials/_messages.html' %}
</main>


<script>
    document.querySelectorAll('select').forEach(select => {
        select.addEventListener('change', function () {

            const isAnySelectOptionEmpty = Array.from(select.options).some(option => option.value === "" && option.selected);

            if (isAnySelectOptionEmpty) {

                const url = new URL(window.location.href);
                url.searchParams.delete(this.name);
                window.location.href = url.toString();
            }
        });
    });


</script>
</body>
</html>
